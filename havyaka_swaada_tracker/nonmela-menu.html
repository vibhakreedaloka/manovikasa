<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Non-Mela Menu — Havyaka Swaada</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    /* Item card */
    .item-card {
      background: var(--cream-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; gap: 10px;
    }
    .item-card.archived { opacity: .6; }
    .item-card-info { flex: 1; min-width: 0; }
    .item-card-name {
      font-family: 'Playfair Display', serif;
      font-size: 15px; color: var(--brown-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-card-price { font-size: 13px; color: var(--gold); font-weight: 700; margin-top: 2px; }
    .item-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--cream); color: var(--brown-mid);
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition);
    }
    .icon-btn:active { background: var(--cream-dark); }
    .icon-btn.danger { color: var(--red); }
    .icon-btn.success { color: var(--green); }

    /* Library list */
    .lib-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 11px 0; border-bottom: 1px dashed var(--border);
    }
    .lib-item:last-child { border-bottom: none; }
    .lib-check {
      width: 22px; height: 22px; border-radius: 6px;
      border: 2px solid var(--border); background: var(--cream);
      cursor: pointer; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: white; transition: all .15s;
    }
    .lib-check.on { background: var(--green); border-color: var(--green); }
    .lib-info { flex: 1; }
    .lib-name { font-size: 14px; font-weight: 600; color: var(--brown-dark); }
    .lib-def-price { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .lib-price-input {
      width: 100%; margin-top: 7px;
      padding: 7px 10px; border: 1.5px solid var(--gold);
      border-radius: 7px; background: var(--cream);
      font-family: 'Nunito', sans-serif; font-size: 14px;
      color: var(--brown); outline: none;
    }
    .lib-badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px;
      border-radius: 10px; flex-shrink: 0; margin-top: 2px;
    }
    .lib-badge.in-menu  { background: rgba(61,99,56,.15); color: var(--green); }
    .lib-badge.archived { background: rgba(184,50,37,.12); color: var(--red); }

    /* Modal tabs */
    .modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .modal-tab {
      flex: 1; padding: 10px; border: none; background: none;
      font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      border-bottom: 3px solid transparent; transition: all .18s;
    }
    .modal-tab.active { color: var(--brown); border-bottom-color: var(--gold); }

    /* Archived toggle */
    .arch-toggle {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--text-muted);
    }
    .arch-toggle:hover { color: var(--brown-mid); }

    /* Setup banner */
    .setup-banner {
      background: var(--brown);
      color: var(--cream); border-radius: var(--radius);
      padding: 18px 16px; text-align: center; margin-bottom: 14px;
    }
    .setup-banner h2 { font-size: 18px; color: var(--gold-light); margin-bottom: 6px; }
    .setup-banner p  { font-size: 13px; opacity: .85; line-height: 1.5; }

    .search-input {
      width: 100%; padding: 9px 12px; margin-bottom: 10px;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--cream); font-family: 'Nunito',sans-serif;
      font-size: 14px; color: var(--brown); outline: none;
    }
    .search-input:focus { border-color: var(--gold); }
  </style>
</head>
<body>

  <header class="hs-header" id="hs-header"></header>

  <main class="hs-page" id="mainPage">
    <!-- Populated by JS -->
  </main>

  <!-- FAB -->
  <button class="hs-fab" onclick="openAddModal()" id="fab" aria-label="Add items">+</button>

  <!-- ══ ADD ITEMS MODAL ══ -->
  <div class="hs-modal-bg" id="addModal">
    <div class="hs-modal">
      <div class="hs-modal-handle"></div>
      <div class="hs-modal-title">Add Items</div>

      <div class="modal-tabs">
        <button class="modal-tab active" id="tabLibBtn" onclick="switchModalTab('lib')">📚 From Library</button>
        <button class="modal-tab"        id="tabNewBtn" onclick="switchModalTab('new')">✨ Create New</button>
      </div>

      <!-- Library Tab -->
      <div id="tabLib">
        <input class="search-input" type="text" id="libSearch"
               placeholder="Search items…" oninput="filterLib()" />
        <div id="libList" style="max-height:45vh;overflow-y:auto;"></div>
        <div class="hs-mt">
          <button class="hs-btn hs-btn-primary hs-btn-full" onclick="addSelectedItems()">
            ✓ Add Selected Items
          </button>
        </div>
      </div>

      <!-- Create New Tab -->
      <div id="tabNew" style="display:none;">
        <div class="hs-field">
          <label class="hs-label">Item Name *</label>
          <input class="hs-input" type="text" id="newName" placeholder="e.g. Mango Juice" autocomplete="off" />
        </div>
        <div class="hs-field">
          <label class="hs-label">Selling Price (₹) *</label>
          <input class="hs-input" type="number" id="newPrice" placeholder="e.g. 60" min="0" />
        </div>
        <div class="hs-field">
          <label class="hs-label">Category</label>
          <div id="newCatWrap"></div>
        </div>
        <div class="hs-mt">
          <button class="hs-btn hs-btn-gold hs-btn-full" onclick="createNewItem()">✨ Create & Add</button>
        </div>
      </div>

      <div class="hs-mt-sm">
        <button class="hs-btn hs-btn-ghost hs-btn-full" onclick="HS.closeModal('addModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ══ EDIT ITEM MODAL ══ -->
  <div class="hs-modal-bg" id="editModal">
    <div class="hs-modal">
      <div class="hs-modal-handle"></div>
      <div class="hs-modal-title">Edit Item</div>
      <input type="hidden" id="editItemKey" />

      <div class="hs-field">
        <label class="hs-label">Item Name</label>
        <input class="hs-input" type="text" id="editName" placeholder="Item name" />
      </div>
      <div class="hs-field">
        <label class="hs-label">Category</label>
        <div id="editCatWrap"></div>
      </div>
      <div class="hs-field">
        <label class="hs-label">Selling Price (₹)</label>
        <input class="hs-input" type="number" id="editPrice" placeholder="e.g. 249" min="0" />
      </div>

      <div class="hs-mt">
        <button class="hs-btn hs-btn-gold hs-btn-full" onclick="saveEdit()">💾 Save Changes</button>
      </div>
      <div class="hs-mt-sm">
        <button class="hs-btn hs-btn-ghost hs-btn-full" onclick="HS.closeModal('editModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="assets/common.js"></script>
  <script>
    let mela         = null;
    let menuItems    = [];
    let allLibItems  = [];
    let categories   = [];   // Global category list
    let setupMode    = false;
    let showArchived = false;

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', () => {
      mela      = HS.getCurrentMela();
      if (!mela) { HS.navigate('index.html'); return; }
      setupMode = HS.getParam('setup') === '1';

      if (setupMode) {
        HS.renderHeader({ title: 'Set Up Menu', subtitle: mela.MelaName, showBack: true });
      } else {
        HS.renderSidebar('nonmela-menu');
        HS.renderHeader({
          title: 'Menu', subtitle: mela.MelaName, showMenu: true,
          rightIcon: '🔄', rightFn: 'loadAll(true)',
        });
      }

      loadAll();
    });

    async function loadAll(forceRefresh = false) {
      HS.loading(true, 'Loading menu…');
      try {
        const extra = forceRefresh ? { noCache: '1' } : {};
        const [menuRes, libRes, catRes] = await Promise.all([
          HS.api({ action: 'getMelaMenu',   melaId: mela.MelaId, ...extra }),
          HS.api({ action: 'getMenuItems',  ...extra }),
          HS.api({ action: 'getCategories' }),
        ]);
        menuItems   = menuRes.data || [];
        allLibItems = libRes.data  || [];
        categories  = catRes.data  || [];
        HS.lsSet('hs_menu_' + mela.MelaId, menuItems);
        render();
        if (setupMode) openAddModal();
        if (forceRefresh) HS.toast('✅ Menu refreshed from sheet!', 'success');
      } catch(e) {
        HS.toast('Could not load menu.', 'error');
      } finally {
        HS.loading(false);
      }
    }

    /* ── RENDER MAIN ── */
    function render() {
      const active   = menuItems.filter(i => i.Status === 'active');
      const archived = menuItems.filter(i => i.Status === 'archived');
      const el       = document.getElementById('mainPage');

      let html = '';

      if (setupMode && active.length === 0) {
        html += `
          <div class="setup-banner">
            <h2>🍽️ Set Up Your Menu</h2>
            <p>Choose items from the library or create new ones.<br/>Tap + below to get started.</p>
          </div>`;
      }

      if (active.length === 0 && !setupMode) {
        html += `
          <div class="hs-empty">
            <div class="hs-empty-icon">🍽️</div>
            <div class="hs-empty-title">No items in menu</div>
            <div class="hs-empty-sub">Tap + to add items from your library or create new ones.</div>
          </div>`;
      } else {
        html += `<div class="hs-section-lbl">Active Items (${active.length})</div>`;
        html += active.map(it => itemCardHTML(it)).join('');
      }

      if (archived.length > 0) {
        html += `
          <div class="arch-toggle" onclick="toggleArchived()">
            <span>${showArchived ? '▾' : '▸'}</span>
            <span>${showArchived ? 'Hide' : 'Show'} Archived (${archived.length})</span>
          </div>`;
        if (showArchived) {
          html += `<div class="hs-section-lbl">Archived</div>`;
          html += archived.map(it => itemCardHTML(it, true)).join('');
        }
      }

      if (setupMode && active.length > 0) {
        html += `
          <div class="hs-mt">
            <button class="hs-btn hs-btn-primary hs-btn-full"
              onclick="HS.navigate('log.html')">📝 Start Logging Sales →</button>
          </div>`;
      }

      el.innerHTML = html;
    }

    function itemCardHTML(it, isArchived = false) {
      if (isArchived) {
        return `
          <div class="item-card archived">
            <div class="item-card-info">
              <div class="item-card-name">${it.ItemName}</div>
              <div class="item-card-price">₹${HS.fmt(it.SellingPrice)} &nbsp;<span class="hs-badge hs-badge-muted">Archived</span></div>
            </div>
            <div class="item-card-actions">
              <button class="icon-btn success" title="Restore" onclick="doRestore('${it.ItemKey}')">↩</button>
            </div>
          </div>`;
      }
      const active  = menuItems.filter(i => i.Status === 'active');
      const idx     = active.findIndex(i => i.ItemKey === it.ItemKey);
      const isFirst = idx === 0;
      const isLast  = idx === active.length - 1;
      return `
        <div class="item-card">
          <div class="item-card-info">
            <div class="item-card-name">${it.ItemName}</div>
            <div style="display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap;">
              <div class="item-card-price">₹${HS.fmt(it.SellingPrice)}</div>
              ${it.Category ? `<span class="hs-badge hs-badge-green" style="font-size:10px;">${it.Category}</span>` : ''}
            </div>
          </div>
          <div class="item-card-actions">
            <button class="icon-btn" title="Move up"   onclick="moveItem('${it.ItemKey}',-1)"
              style="opacity:${isFirst?'0.25':'1'};pointer-events:${isFirst?'none':'auto'}">↑</button>
            <button class="icon-btn" title="Move down" onclick="moveItem('${it.ItemKey}',1)"
              style="opacity:${isLast?'0.25':'1'};pointer-events:${isLast?'none':'auto'}">↓</button>
            <button class="icon-btn" title="Recipe / BOM" onclick="HS.navigate('recipes.html',{itemKey:'${it.ItemKey}'})">🧪</button>
            <button class="icon-btn" title="Edit"    onclick="openEditModal('${it.ItemKey}')">✏️</button>
            <button class="icon-btn danger" title="Archive" onclick="doArchive('${it.ItemKey}')">📦</button>
          </div>
        </div>`;
    }

    function toggleArchived() { showArchived = !showArchived; render(); }

    /* ── CATEGORY HELPERS ── */
    function catSelectHTML(wrapperId, selected = '') {
      const opts = categories.map(c =>
        `<option value="${c}" ${c===selected?'selected':''}>${c}</option>`
      ).join('');
      return `
        <select class="hs-input" id="${wrapperId}_sel" onchange="onCatChange('${wrapperId}')">
          <option value="">-- Select category --</option>
          ${opts}
          <option value="__new__">＋ Add new category</option>
        </select>
        <div id="${wrapperId}_new" style="display:none;margin-top:8px;">
          <div class="hs-row">
            <input class="hs-input" type="text" id="${wrapperId}_inp"
                   placeholder="New category name…" style="flex:1;" />
            <button class="hs-btn hs-btn-primary hs-btn-sm"
                    onclick="confirmNewCat('${wrapperId}')">Add</button>
          </div>
        </div>`;
    }

    function onCatChange(wrapperId) {
      const sel = document.getElementById(wrapperId + '_sel');
      const nf  = document.getElementById(wrapperId + '_new');
      if (sel.value === '__new__') {
        nf.style.display = 'block';
        document.getElementById(wrapperId + '_inp').focus();
      } else {
        nf.style.display = 'none';
      }
    }

    async function confirmNewCat(wrapperId) {
      const inp  = document.getElementById(wrapperId + '_inp');
      const name = inp.value.trim();
      if (!name) { HS.toast('Enter a category name.', 'error'); return; }
      try {
        const res = await HS.api({ action: 'addCategory', name });
        if (res.success) {
          categories.push(name);
          // Re-render the select and select new category
          const wrap = document.getElementById(wrapperId);
          wrap.innerHTML = catSelectHTML(wrapperId, name);
          HS.toast('✅ Category added!', 'success');
        }
      } catch(e) { HS.toast('Network error.', 'error'); }
    }

    function getCatValue(wrapperId) {
      const sel = document.getElementById(wrapperId + '_sel');
      return sel && sel.value !== '__new__' ? sel.value : '';
    }

    /* ── ADD MODAL ── */
    let modalTab = 'lib';

    function openAddModal() {
      buildLibList();
      document.getElementById('newName').value  = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('libSearch').value = '';
      // Render category dropdown for create form
      document.getElementById('newCatWrap').innerHTML = catSelectHTML('newCatWrap', '');
      switchModalTab('lib');
      HS.openModal('addModal');
    }

    function switchModalTab(tab) {
      modalTab = tab;
      document.getElementById('tabLib').style.display    = tab === 'lib' ? '' : 'none';
      document.getElementById('tabNew').style.display    = tab === 'new' ? '' : 'none';
      document.getElementById('tabLibBtn').className = 'modal-tab' + (tab === 'lib' ? ' active' : '');
      document.getElementById('tabNewBtn').className = 'modal-tab' + (tab === 'new' ? ' active' : '');
    }

    /* Build library list */
    function buildLibList(query = '') {
      const inMenuActive   = new Set(menuItems.filter(i => i.Status==='active')  .map(i => i.ItemKey));
      const inMenuArchived = new Set(menuItems.filter(i => i.Status==='archived').map(i => i.ItemKey));

      const filtered = allLibItems.filter(it =>
        !query || it.ItemName.toLowerCase().includes(query.toLowerCase())
      );

      if (!filtered.length) {
        document.getElementById('libList').innerHTML =
          '<div class="hs-text-muted" style="text-align:center;padding:20px;">No items found.</div>';
        return;
      }

      document.getElementById('libList').innerHTML = filtered.map(it => {
        if (inMenuActive.has(it.ItemKey)) {
          return `
            <div class="lib-item">
              <div class="lib-info"><div class="lib-name">${it.ItemName}</div></div>
              <span class="lib-badge in-menu">✓ In Menu</span>
            </div>`;
        }
        if (inMenuArchived.has(it.ItemKey)) {
          return `
            <div class="lib-item">
              <div class="lib-info"><div class="lib-name">${it.ItemName}</div></div>
              <span class="lib-badge archived">Archived</span>
            </div>`;
        }
        return `
          <div class="lib-item" id="lib-${it.ItemKey}">
            <div class="lib-check" id="chk-${it.ItemKey}" onclick="toggleLib('${it.ItemKey}','${it.DefaultPrice}')"></div>
            <div class="lib-info">
              <div class="lib-name">${it.ItemName}</div>
              <div class="lib-def-price">Default: ₹${HS.fmt(it.DefaultPrice)}</div>
              <div id="price-row-${it.ItemKey}" style="display:none;">
                <input class="lib-price-input" type="number" min="0"
                  id="lib-price-${it.ItemKey}" placeholder="Selling price for this mela"
                  value="${it.DefaultPrice}" />
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function filterLib() {
      buildLibList(document.getElementById('libSearch').value);
    }

    function toggleLib(key, defaultPrice) {
      const chk       = document.getElementById('chk-' + key);
      const priceRow  = document.getElementById('price-row-' + key);
      const isOn      = chk.classList.toggle('on');
      chk.textContent = isOn ? '✓' : '';
      priceRow.style.display = isOn ? 'block' : 'none';
      if (isOn) document.getElementById('lib-price-' + key).focus();
    }

    /* Add selected items from library */
    async function addSelectedItems() {
      const selected = [];
      const inMenuActive = new Set(menuItems.filter(i=>i.Status==='active').map(i=>i.ItemKey));

      allLibItems.forEach(it => {
        if (inMenuActive.has(it.ItemKey)) return;
        const chk = document.getElementById('chk-' + it.ItemKey);
        if (chk && chk.classList.contains('on')) {
          const priceEl = document.getElementById('lib-price-' + it.ItemKey);
          const price   = priceEl ? Number(priceEl.value) : it.DefaultPrice;
          selected.push({ itemKey: it.ItemKey, sellingPrice: price });
        }
      });

      if (!selected.length) { HS.toast('Select at least one item.', 'error'); return; }

      HS.closeModal('addModal');
      HS.loading(true, 'Adding items…');
      try {
        const res = await HS.api({
          action: 'addToMelaMenu',
          data: JSON.stringify({ melaId: mela.MelaId, items: selected }),
        });
        if (res.success) { HS.toast(`✅ ${selected.length} item(s) added!`, 'success'); await loadAll(); }
        else HS.toast('Error: ' + (res.error||'Unknown'), 'error');
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }

    /* Create new item */
    async function createNewItem() {
      const name     = document.getElementById('newName').value.trim();
      const priceVal = document.getElementById('newPrice').value.trim();
      const category = getCatValue('newCatWrap');
      if (!name)           { HS.toast('Item name is required.', 'error'); return; }
      if (priceVal === '') { HS.toast('Selling price is required.', 'error'); return; }
      const price = Number(priceVal);
      if (isNaN(price) || price < 0) { HS.toast('Enter a valid price (0 or more).', 'error'); return; }

      HS.closeModal('addModal');
      HS.loading(true, 'Creating item…');
      try {
        const res = await HS.api({
          action: 'createMenuItem',
          data: JSON.stringify({ name, price, category, melaId: mela.MelaId }),
        });
        if (res.success) { HS.toast('✅ Item created!', 'success'); await loadAll(); }
        else HS.toast('Error: ' + (res.error||'Unknown'), 'error');
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }

    /* ── EDIT MODAL ── */
    function openEditModal(itemKey) {
      const it = menuItems.find(i => i.ItemKey === itemKey);
      if (!it) return;
      document.getElementById('editItemKey').value = itemKey;
      document.getElementById('editName').value    = it.ItemName;
      document.getElementById('editPrice').value   = it.SellingPrice;
      document.getElementById('editCatWrap').innerHTML = catSelectHTML('editCatWrap', it.Category || '');
      HS.openModal('editModal');
    }

    async function saveEdit() {
      const itemKey  = document.getElementById('editItemKey').value;
      const name     = document.getElementById('editName').value.trim();
      const priceVal = document.getElementById('editPrice').value.trim();
      const category = getCatValue('editCatWrap');
      if (!name)           { HS.toast('Item name is required.', 'error'); return; }
      if (priceVal === '') { HS.toast('Price is required.', 'error'); return; }
      const price = Number(priceVal);
      if (isNaN(price) || price < 0) { HS.toast('Enter a valid price (0 or more).', 'error'); return; }

      HS.closeModal('editModal');
      HS.loading(true, 'Saving…');
      try {
        const payload = { melaId: mela.MelaId, itemKey, sellingPrice: price, itemName: name, category };
        const res = await HS.api({ action: 'updateMelaMenuItem', data: JSON.stringify(payload) });
        if (res.success) { HS.toast('✅ Item updated!', 'success'); await loadAll(); }
        else HS.toast('Error: ' + (res.error||'Unknown'), 'error');
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }

    /* ── REORDER ── */
    async function moveItem(itemKey, direction) {
      const active = menuItems.filter(i => i.Status === 'active');
      const idx    = active.findIndex(i => i.ItemKey === itemKey);
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= active.length) return;

      // Swap in local array (optimistic update)
      [active[idx], active[newIdx]] = [active[newIdx], active[idx]];
      const archived = menuItems.filter(i => i.Status === 'archived');
      menuItems = [...active, ...archived];
      render();

      // Persist to server
      try {
        await HS.api({
          action: 'reorderMelaMenu',
          data: JSON.stringify({ melaId: mela.MelaId, order: active.map(i => i.ItemKey) }),
        });
      } catch(e) { HS.toast('Could not save order. Try again.', 'error'); }
    }

    /* ── ARCHIVE / RESTORE ── */
    async function doArchive(itemKey) {
      const it = menuItems.find(i => i.ItemKey === itemKey);
      HS.confirm(`Archive "${it?.ItemName}"? Orders already logged will not be affected.`, async () => {
        HS.loading(true, 'Archiving…');
        try {
          const res = await HS.api({ action: 'archiveMelaMenuItem', melaId: mela.MelaId, itemKey });
          if (res.success) { HS.toast('Item archived.'); await loadAll(); }
          else HS.toast('Error: ' + (res.error||'Unknown'), 'error');
        } catch(e) { HS.toast('Network error.', 'error'); }
        finally { HS.loading(false); }
      });
    }

    async function doRestore(itemKey) {
      HS.loading(true, 'Restoring…');
      try {
        const res = await HS.api({ action: 'restoreMelaMenuItem', melaId: mela.MelaId, itemKey });
        if (res.success) { HS.toast('✅ Item restored!', 'success'); await loadAll(); }
        else HS.toast('Error: ' + (res.error||'Unknown'), 'error');
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }
  </script>
</body>
