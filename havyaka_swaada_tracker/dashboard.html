<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Dashboard — Havyaka Swaada</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .chart-wrap       { position: relative; height: 260px; margin-top: 10px; }
    .chart-wrap.tall  { height: 320px; }
    .chart-wrap.short { height: 200px; }
    .day-chips        { display: flex; flex-wrap: wrap; gap: 7px; }
    .inf-note         { font-size: 12px; color: var(--gold); font-weight: 600;
                        text-align: center; margin-bottom: 10px; }
    .tab-panel        { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>

  <header class="hs-header" id="hs-header"></header>

  <div class="hs-top-tabs">
    <button class="hs-tab active"  onclick="switchTab('mela',    this)">This Mela</button>
    <button class="hs-tab"         onclick="switchTab('compare', this)">Mela vs Mela</button>
    <button class="hs-tab"         onclick="switchTab('all',     this)">All Melas</button>
    <button class="hs-tab"         onclick="switchTab('pl',      this)">P&amp;L</button>
  </div>

  <main class="hs-page">

    <!-- TAB 1: THIS MELA -->
    <div class="tab-panel active" id="panel-mela">
      <button class="hs-btn hs-btn-secondary hs-btn-full hs-mb" style="margin-top:0;" onclick="loadMelaData()">🔄 Refresh</button>
      <div class="hs-card">
        <div class="hs-card-title">📆 Filter by Day</div>
        <div class="day-chips" id="dayChips"></div>
      </div>
      <div class="hs-stat-grid">
        <div class="hs-stat-box s-green"><div class="hs-stat-num" id="sTotal">₹0</div> <div class="hs-stat-lbl">Revenue</div></div>
        <div class="hs-stat-box">       <div class="hs-stat-num" id="sOrders">0</div>  <div class="hs-stat-lbl">Orders</div></div>
        <div class="hs-stat-box">       <div class="hs-stat-num" id="sCash">₹0</div>   <div class="hs-stat-lbl">Cash</div></div>
        <div class="hs-stat-box s-gold"><div class="hs-stat-num" id="sOnline">₹0</div> <div class="hs-stat-lbl">Online</div></div>
        <div class="hs-stat-box s-red"> <div class="hs-stat-num" id="sPending">₹0</div><div class="hs-stat-lbl">Org. Pending</div></div>
        <div class="hs-stat-box">       <div class="hs-stat-num" id="sFree">₹0</div>   <div class="hs-stat-lbl">Free Given</div></div>
      </div>
      <div class="inf-note" id="infNote" style="display:none;"></div>
      <div class="hs-card"><div class="hs-card-title">📦 Items Sold — Count</div>   <div class="chart-wrap tall"><canvas id="chartCount"></canvas></div></div>
      <div class="hs-card"><div class="hs-card-title">💰 Revenue by Item</div>      <div class="chart-wrap tall"><canvas id="chartRevenue"></canvas></div></div>
      <div class="hs-card"><div class="hs-card-title">🗂️ Revenue by Category</div> <div class="chart-wrap"><canvas id="chartCategory"></canvas></div></div>
      <div class="hs-card"><div class="hs-card-title">💳 Cash vs Online — Orders</div><div class="chart-wrap short"><canvas id="chartPayment"></canvas></div></div>
    </div>

    <!-- TAB 2: MELA VS MELA -->
    <div class="tab-panel" id="panel-compare">
      <button class="hs-btn hs-btn-secondary hs-btn-full hs-mb" style="margin-top:0;" onclick="loadAllData(true)">🔄 Refresh</button>
      <div id="compareContent"><div style="text-align:center;padding:32px;color:var(--text-muted);">Tap Refresh to load comparison data.</div></div>
    </div>

    <!-- TAB 3: ALL MELAS -->
    <div class="tab-panel" id="panel-all">
      <button class="hs-btn hs-btn-secondary hs-btn-full hs-mb" style="margin-top:0;" onclick="loadAllData(true)">🔄 Refresh</button>
      <div id="allContent"><div style="text-align:center;padding:32px;color:var(--text-muted);">Tap Refresh to load all-mela data.</div></div>
    </div>

    <!-- TAB 4: P&L -->
    <div class="tab-panel" id="panel-pl">
      <button class="hs-btn hs-btn-secondary hs-btn-full hs-mb" style="margin-top:0;" onclick="loadPL(true)">🔄 Refresh</button>
      <div id="plContent"><div style="text-align:center;padding:32px;color:var(--text-muted);">Tap Refresh to load P&amp;L data.</div></div>
    </div>

  </main>

  <script src="assets/common.js"></script>
  <script>
    /* ── BACKWARD COMPAT: old column → item key ── */
    const OLD_COL_TO_KEY = {
      'NeerGojjuShot':     'item_neerShot',
      'NeerGojjuFull':     'item_neerFull',
      'HunaseHannina':     'item_hunase',
      'HalfHunaseHannina': 'item_halfHunase',
      'MandanGojju100':    'item_mandan100',
      'MandanGojju200':    'item_mandan200',
      'MandanGojju500':    'item_mandan500',
      'MangoGula100':      'item_mangoGula100',
      'MangoGula250':      'item_mangoGula250',
    };

    const MELA_PALETTE = ['#3D6338','#C4841A','#8B4513','#4E7A49','#6B9E65',
                          '#E0A830','#A0632A','#2D4E28','#7A4520','#3D1F00'];

    /* ── STATE ── */
    let melaRows  = [];
    let melaMenu  = [];     // [{ItemKey, ItemName, SellingPrice, ...}]
    let itemMap   = {};     // itemKey → {ItemName, SellingPrice}
    let selDay    = 'all';
    let allCache  = null;
    let plCache   = null;
    let globalItems = [];
    let myCharts  = {};
    let curTab    = 'mela';
    let mela      = null;

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', () => {
      mela = HS.getCurrentMela();
      if (!mela) { HS.navigate('index.html'); return; }
      HS.renderSidebar('dashboard');
      HS.renderHeader({ title: 'Dashboard', subtitle: mela.MelaName, showMenu: true });
      loadMelaData();
    });

    /* ── NORMALIZE ROW ── */
    function normalizeRow(row) {
      if (row.Items !== undefined && row.Items !== '') {
        try {
          const parsed = JSON.parse(row.Items);
          row._items = {};
          Object.entries(parsed).forEach(([key, val]) => {
            if (val && typeof val === 'object') {
              const p = (val.price !== null && val.price !== undefined) ? Number(val.price) : null;
              row._items[key] = { qty: Number(val.qty || 0), price: p };
            } else {
              row._items[key] = { qty: Number(val || 0), price: null };
            }
          });
        } catch { row._items = {}; }
      } else {
        row._items = {};
        Object.entries(OLD_COL_TO_KEY).forEach(([col, key]) => {
          const q = Number(row[col] || 0);
          if (q > 0) row._items[key] = { qty: q, price: null };
        });
      }
      return row;
    }

    /* ── TAB SWITCH ── */
    function switchTab(tab, el) {
      curTab = tab;
      document.querySelectorAll('.hs-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      if ((tab === 'compare' || tab === 'all') && !allCache) loadAllData(false);
      else if (tab === 'compare') renderCompare();
      else if (tab === 'all') renderAll();
      else if (tab === 'pl' && !plCache) loadPL(false);
      else if (tab === 'pl') renderPL();
    }

    /* ═══ TAB 1 — THIS MELA ═══ */
    async function loadMelaData() {
      HS.loading(true, 'Loading data…');
      try {
        const [menuRes, dataRes] = await Promise.all([
          HS.api({ action: 'getMelaMenu', melaId: mela.MelaId }),
          HS.api({ action: 'getData',     melaId: mela.MelaId }),
        ]);
        melaMenu = menuRes.data || [];
        itemMap  = {};
        melaMenu.forEach(it => { itemMap[it.ItemKey] = { name: it.ItemName, price: Number(it.SellingPrice)||0, category: it.Category||'Uncategorised' }; });

        // Also add old default items to itemMap for backward compat
        Object.entries(OLD_COL_TO_KEY).forEach(([col, key]) => {
          if (!itemMap[key]) itemMap[key] = { name: col, price: 0 };
        });

        melaRows = (dataRes.data || []).map(r => normalizeRow({ ...r, Date: HS.normDate(r.Date) }));
        selDay   = 'all';
        buildDayChips();
        renderMelaDash();
      } catch(e) {
        HS.toast('Could not load data.', 'error');
      } finally { HS.loading(false); }
    }

    function buildDayChips() {
      const days = [...new Set(melaRows.map(r => r.Date).filter(Boolean))].sort();
      const el   = document.getElementById('dayChips');
      el.innerHTML = chipHTML('all','All Days', selDay==='all');
      days.forEach(d => { el.innerHTML += chipHTML(d, HS.shortDate(d), selDay===d); });
    }

    function chipHTML(val, lbl, on) {
      const cls = on ? 'hs-badge hs-badge-brown' : 'hs-badge hs-badge-muted';
      return `<div class="${cls}" style="padding:6px 14px;cursor:pointer;" onclick="pickDay('${val}')">${lbl}</div>`;
    }

    function pickDay(day) { selDay=day; buildDayChips(); renderMelaDash(); }

    function filteredRows() { return selDay==='all' ? melaRows : melaRows.filter(r => r.Date===selDay); }

    function renderMelaDash() {
      const rows      = filteredRows();
      const paying    = rows.filter(r => r.CustomerType !== 'influencer');
      const infRows   = rows.filter(r => r.CustomerType === 'influencer');

      // Revenue = Cash + Online only
      const revenue   = rows.filter(r => r.PaymentMode==='cash'||r.PaymentMode==='online')
                            .reduce((s,r) => s+Number(r.TotalAmount||0), 0);
      const cashRev   = rows.filter(r => r.PaymentMode==='cash')  .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const onlineRev = rows.filter(r => r.PaymentMode==='online').reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const orgPending= rows.filter(r => r.PaymentMode==='organiser').reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const freeVal   = rows.filter(r => r.PaymentMode==='free')  .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const infRev    = infRows.filter(r=>r.PaymentMode==='cash'||r.PaymentMode==='online')
                               .reduce((s,r)=>s+Number(r.TotalAmount||0),0);

      document.getElementById('sTotal').textContent  = '₹'+HS.fmt(revenue);
      document.getElementById('sOrders').textContent = rows.length;
      document.getElementById('sCash').textContent   = '₹'+HS.fmt(cashRev);
      document.getElementById('sOnline').textContent = '₹'+HS.fmt(onlineRev);
      document.getElementById('sPending').textContent= '₹'+HS.fmt(orgPending);
      document.getElementById('sFree').textContent   = '₹'+HS.fmt(freeVal);

      const infNote = document.getElementById('infNote');
      if (infRev>0) { infNote.style.display='block'; infNote.textContent=`⭐ Influencer refund: ₹${HS.fmt(infRev)} (${infRows.filter(r=>r.PaymentMode==='cash'||r.PaymentMode==='online').length} orders)`; }
      else infNote.style.display='none';

      // Aggregate dynamically — use stored price if available, fall back to current price
      const counts={}, revenues={};
      rows.forEach(row => {
        Object.entries(row._items||{}).forEach(([key, val]) => {
          const q = val.qty || 0;
          const p = val.price !== null ? val.price : (itemMap[key]?.price || 0);
          counts[key]   = (counts[key]||0) + q;
          revenues[key] = (revenues[key]||0) + q * p;
        });
      });

      // Build ordered item list (mela menu first, then any extras from old data)
      const knownKeys = melaMenu.filter(i=>i.Status==='active').map(i=>i.ItemKey);
      const allKeys   = [...new Set([...knownKeys, ...Object.keys(counts)])];
      const labels    = allKeys.map(k => itemMap[k]?.name || k);
      const colors    = allKeys.map((_, i) => MELA_PALETTE[i % MELA_PALETTE.length]);

      drawHBar('chartCount',   labels, allKeys.map(k=>counts[k]||0),   colors);
      drawHBar('chartRevenue', labels, allKeys.map(k=>revenues[k]||0), colors, true);

      // Category — group revenue by actual Category field
      const cats = {};
      Object.keys(revenues).forEach(key => {
        const cat = itemMap[key]?.category || 'Uncategorised';
        cats[cat] = (cats[cat]||0) + (revenues[key]||0);
      });
      const catLabels = Object.keys(cats).filter(c => cats[c] > 0);
      drawHBar('chartCategory', catLabels, catLabels.map(c=>cats[c]),
               catLabels.map((_,i)=>MELA_PALETTE[i%MELA_PALETTE.length]), true);

      // Payment breakdown — all 4 modes
      drawHBar('chartPayment',
        ['Cash','Online','Organiser (Pending)','Free'],
        [ rows.filter(r=>r.PaymentMode==='cash').length,
          rows.filter(r=>r.PaymentMode==='online').length,
          rows.filter(r=>r.PaymentMode==='organiser').length,
          rows.filter(r=>r.PaymentMode==='free').length ],
        ['#3D6338','#C4841A','#B83225','#A09070']);
    }

    /* ═══ TAB 2 & 3 — ALL MELAS ═══ */
    async function loadAllData(force=false) {
      if (allCache && !force) { renderCompare(); renderAll(); return; }
      HS.loading(true, 'Loading all melas…');
      document.getElementById('compareContent').innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-muted);">⏳ Fetching…</div>';
      document.getElementById('allContent').innerHTML     = '<div style="text-align:center;padding:32px;color:var(--text-muted);">⏳ Fetching…</div>';
      try {
        const [melasRes, globalRes] = await Promise.all([
          HS.api({ action: 'getMelas' }),
          HS.api({ action: 'getMenuItems' }),
        ]);
        const allMelas = (melasRes.data||[]).map(m=>({...m, DateFrom:HS.normDate(m.DateFrom), DateTo:HS.normDate(m.DateTo)})).reverse();
        globalItems    = globalRes.data || [];

        // Build global item map
        const gItemMap = {};
        globalItems.forEach(it => { gItemMap[it.ItemKey] = { name: it.ItemName, price: Number(it.DefaultPrice)||0, category: it.Category||'Uncategorised' }; });
        Object.entries(OLD_COL_TO_KEY).forEach(([col,key]) => { if (!gItemMap[key]) gItemMap[key]={name:col,price:0,category:'Uncategorised'}; });

        // Fetch purchases for all melas
        const purchases = {};
        await Promise.all(allMelas.map(async m => {
          try {
            const res = await HS.api({ action:'getData', melaId: m.MelaId });
            purchases[m.MelaId] = (res.data||[]).map(r=>normalizeRow({...r,Date:HS.normDate(r.Date)}));
          } catch { purchases[m.MelaId]=[]; }
        }));

        allCache = { melas: allMelas, purchases, gItemMap };
        renderCompare(); renderAll();
      } catch(e) { HS.toast('Could not load all data.','error'); }
      finally { HS.loading(false); }
    }

    function renderCompare() {
      if (!allCache) return;
      const { melas, purchases } = allCache;
      if (!melas.length) { document.getElementById('compareContent').innerHTML='<div style="text-align:center;padding:32px;color:var(--text-muted);">No melas found.</div>'; return; }

      const stats = melas.map((m,i) => {
        const rows    = purchases[m.MelaId]||[];
        const paying  = rows.filter(r=>r.CustomerType!=='influencer');
        const revenue = rows.reduce((s,r)=>s+Number(r.TotalAmount||0),0);
        return { name:m.MelaName, revenue, orders:rows.length,
          cashRev:   paying.filter(r=>r.PaymentMode==='cash')  .reduce((s,r)=>s+Number(r.TotalAmount||0),0),
          onlineRev: paying.filter(r=>r.PaymentMode==='online').reduce((s,r)=>s+Number(r.TotalAmount||0),0),
          color: MELA_PALETTE[i%MELA_PALETTE.length] };
      });

      const labels = stats.map(s=>s.name);
      const colors = stats.map(s=>s.color);
      document.getElementById('compareContent').innerHTML = `
        <div class="hs-card"><div class="hs-card-title">💰 Revenue per Mela</div>  <div class="chart-wrap tall"><canvas id="cmpRevenue"></canvas></div></div>
        <div class="hs-card"><div class="hs-card-title">🧾 Orders per Mela</div>   <div class="chart-wrap"><canvas id="cmpOrders"></canvas></div></div>
        <div class="hs-card"><div class="hs-card-title">💵 Cash per Mela</div>     <div class="chart-wrap"><canvas id="cmpCash"></canvas></div></div>
        <div class="hs-card"><div class="hs-card-title">📱 Online per Mela</div>   <div class="chart-wrap"><canvas id="cmpOnline"></canvas></div></div>`;
      drawHBar('cmpRevenue',labels,stats.map(s=>s.revenue), colors,true);
      drawHBar('cmpOrders', labels,stats.map(s=>s.orders),  colors);
      drawHBar('cmpCash',   labels,stats.map(s=>s.cashRev), colors,true);
      drawHBar('cmpOnline', labels,stats.map(s=>s.onlineRev),colors,true);
    }

    function renderAll() {
      if (!allCache) return;
      const { melas, purchases, gItemMap } = allCache;
      const allRows   = Object.values(purchases).flat();
      const paying    = allRows.filter(r=>r.CustomerType!=='influencer');
      const infRows   = allRows.filter(r=>r.CustomerType==='influencer');
      const revenue   = allRows.filter(r=>r.PaymentMode==='cash'||r.PaymentMode==='online').reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const cashRev   = allRows.filter(r=>r.PaymentMode==='cash')      .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const onlineRev = allRows.filter(r=>r.PaymentMode==='online')    .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const orgPending= allRows.filter(r=>r.PaymentMode==='organiser') .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const freeVal   = allRows.filter(r=>r.PaymentMode==='free')      .reduce((s,r)=>s+Number(r.TotalAmount||0),0);
      const infRev    = allRows.filter(r=>r.CustomerType==='influencer'&&(r.PaymentMode==='cash'||r.PaymentMode==='online')).reduce((s,r)=>s+Number(r.TotalAmount||0),0);

      // Aggregate all items — use stored price if available
      const counts={}, revenues={};
      allRows.forEach(row => {
        Object.entries(row._items||{}).forEach(([key,val]) => {
          const q = val.qty || 0;
          const p = val.price !== null ? val.price : (gItemMap[key]?.price || 0);
          counts[key]   = (counts[key]||0) + q;
          revenues[key] = (revenues[key]||0) + q * p;
        });
      });

      const allKeys  = Object.keys(counts).filter(k=>counts[k]>0);
      const labels   = allKeys.map(k=>gItemMap[k]?.name||k);
      const colors   = allKeys.map((_,i)=>MELA_PALETTE[i%MELA_PALETTE.length]);
      const active   = melas.filter(m=>m.Status!=='archived').length;
      const archived = melas.filter(m=>m.Status==='archived').length;

      document.getElementById('allContent').innerHTML = `
        <div class="hs-stat-grid">
          <div class="hs-stat-box s-green"><div class="hs-stat-num">₹${HS.fmt(revenue)}</div>    <div class="hs-stat-lbl">Total Revenue</div></div>
          <div class="hs-stat-box">        <div class="hs-stat-num">${allRows.length}</div>        <div class="hs-stat-lbl">Total Orders</div></div>
          <div class="hs-stat-box">        <div class="hs-stat-num">₹${HS.fmt(cashRev)}</div>    <div class="hs-stat-lbl">Cash</div></div>
          <div class="hs-stat-box s-gold"> <div class="hs-stat-num">₹${HS.fmt(onlineRev)}</div>  <div class="hs-stat-lbl">Online</div></div>
          <div class="hs-stat-box s-red">  <div class="hs-stat-num">₹${HS.fmt(orgPending)}</div> <div class="hs-stat-lbl">Org. Pending</div></div>
          <div class="hs-stat-box">        <div class="hs-stat-num">${active}</div>               <div class="hs-stat-lbl">Active Melas</div></div>
        </div>
        ${infRev>0?`<div class="inf-note hs-mb">⭐ Total influencer refunds: ₹${HS.fmt(infRev)}</div>`:''}
        ${freeVal>0?`<div class="inf-note hs-mb" style="color:var(--text-muted)">🎁 Total free given: ₹${HS.fmt(freeVal)}</div>`:''}
        <div class="hs-card"><div class="hs-card-title">📦 Items Sold — All Melas</div>    <div class="chart-wrap tall"><canvas id="allCount"></canvas></div></div>
        <div class="hs-card"><div class="hs-card-title">💰 Revenue by Item — All Melas</div><div class="chart-wrap tall"><canvas id="allRevenue"></canvas></div></div>
        <div class="hs-card"><div class="hs-card-title">💳 Payment Breakdown — All Melas</div><div class="chart-wrap short"><canvas id="allPayment"></canvas></div></div>`;
      drawHBar('allCount',  labels,allKeys.map(k=>counts[k]),   colors);
      drawHBar('allRevenue',labels,allKeys.map(k=>revenues[k]), colors,true);
      drawHBar('allPayment',['Cash','Online','Organiser (Pending)','Free'],
        [allRows.filter(r=>r.PaymentMode==='cash').length, allRows.filter(r=>r.PaymentMode==='online').length,
         allRows.filter(r=>r.PaymentMode==='organiser').length, allRows.filter(r=>r.PaymentMode==='free').length],
        ['#3D6338','#C4841A','#B83225','#A09070']);
    }

    /* ── HORIZONTAL BAR CHART ── */
    function drawHBar(id, labels, data, colors, isRupee=false) {
      if (myCharts[id]) { myCharts[id].destroy(); delete myCharts[id]; }
      const canvas = document.getElementById(id);
      if (!canvas) return;
      const bgColors = Array.isArray(colors) && colors.length===data.length
        ? colors : Array(data.length).fill(colors[0]||'#3D6338');
      myCharts[id] = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: { labels, datasets:[{ data, backgroundColor:bgColors, borderRadius:5, borderSkipped:false }] },
        options: {
          indexAxis: 'y', responsive:true, maintainAspectRatio:false,
          plugins: {
            legend: { display:false },
            tooltip: { callbacks: { label: ctx => isRupee?` ₹${HS.fmt(ctx.parsed.x)}`:` ${ctx.parsed.x}` } }
          },
          scales: {
            x: { beginAtZero:true, grid:{color:'rgba(0,0,0,.06)'},
                 ticks:{font:{family:'Nunito',size:11},color:'#A09070', callback:v=>isRupee?'₹'+HS.fmt(v):v} },
            y: { grid:{display:false}, ticks:{font:{family:'Nunito',size:11},color:'#7A6040',
                 callback: function(value) {
                   const label = this.getLabelForValue(value);
                   return label.length > 22 ? label.slice(0, 22) + '…' : label;
                 }} }
          }
        }
      });
    }

    /* ═══ TAB 4 — P&L ═══ */
    async function loadPL(force) {
      if (plCache && !force) { renderPL(); return; }
      HS.loading(true, 'Loading P&L…');
      try {
        // Load all non-archived melas
        const melasRes = await HS.api({ action: 'getMelas' });
        const allMelas = (melasRes.data || []).filter(m => m.Status !== 'archived').reverse();

        // For each mela, load purchases + expenses in parallel
        const results = await Promise.all(allMelas.map(async m => {
          const [dataRes, expRes] = await Promise.all([
            HS.api({ action: 'getData',       melaId: m.MelaId }),
            HS.api({ action: 'getExpenses',    melaId: m.MelaId }),
          ]);
          const rows     = (dataRes.data || []).map(normalizeRow);
          const revenue  = rows.filter(r => r.PaymentMode==='cash'||r.PaymentMode==='online')
                               .reduce((s,r) => s+Number(r.TotalAmount||0), 0);
          const expenses = (expRes.data || []).reduce((s,e) => s+Number(e.Amount||0), 0);
          return { mela: m, revenue, expenses, profit: revenue - expenses };
        }));

        plCache = results;
        renderPL();
      } catch(e) { HS.toast('Could not load P&L data.', 'error'); }
      finally { HS.loading(false); }
    }

    function renderPL() {
      if (!plCache) return;
      const data = plCache;

      const totalRev  = data.reduce((s,d) => s+d.revenue,  0);
      const totalExp  = data.reduce((s,d) => s+d.expenses, 0);
      const totalProf = totalRev - totalExp;
      const profClass = totalProf >= 0 ? 's-green' : 's-red';

      // Find current mela entry
      const cur = data.find(d => d.mela.MelaId === mela.MelaId);

      let html = `
        <div class="hs-stat-grid">
          <div class="hs-stat-box s-green"><div class="hs-stat-num">₹${HS.fmt(totalRev)}</div>  <div class="hs-stat-lbl">Total Revenue</div></div>
          <div class="hs-stat-box s-red">  <div class="hs-stat-num">₹${HS.fmt(totalExp)}</div>  <div class="hs-stat-lbl">Total Expenses</div></div>
          <div class="hs-stat-box ${profClass} " style="grid-column:1/-1;">
            <div class="hs-stat-num">${totalProf>=0?'':'−'}₹${HS.fmt(Math.abs(totalProf))}</div>
            <div class="hs-stat-lbl">Net ${totalProf>=0?'Profit':'Loss'} — All Melas</div>
          </div>
        </div>`;

      // Per-mela table
      html += `<div class="hs-card"><div class="hs-card-title">📊 Mela-wise P&L</div>`;
      data.forEach(d => {
        const profit  = d.profit;
        const isProfit = profit >= 0;
        const pct = d.revenue > 0 ? Math.round(profit/d.revenue*100) : 0;
        const isCur = d.mela.MelaId === mela.MelaId;
        html += `
          <div style="padding:10px 0;border-bottom:1px dashed var(--border);">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <div style="font-weight:700;font-size:13px;color:var(--brown);">
                  ${d.mela.MelaName}${isCur?' <span style="font-size:10px;color:var(--gold);">● current</span>':''}
                </div>
                <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px;">
                  Rev ₹${HS.fmt(d.revenue)} &nbsp;·&nbsp; Exp ₹${HS.fmt(d.expenses)}
                </div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <div style="font-family:'Playfair Display',serif;font-size:16px;font-weight:700;
                            color:${isProfit?'var(--green)':'var(--red)'};">
                  ${isProfit?'+':'−'}₹${HS.fmt(Math.abs(profit))}
                </div>
                <div style="font-size:11px;color:var(--text-muted);">${isProfit?'Profit':'Loss'} ${pct!==0?'('+Math.abs(pct)+'%)':''}</div>
              </div>
            </div>
          </div>`;
      });
      html += `</div>`;

      // Revenue vs Expenses bar chart
      if (data.length > 0) {
        html += `<div class="hs-card"><div class="hs-card-title">💰 Revenue vs Expenses</div><div class="chart-wrap" style="height:${Math.max(120,data.length*55)}px;"><canvas id="plChart"></canvas></div></div>`;
      }

      document.getElementById('plContent').innerHTML = html;

      // Draw grouped bar chart
      if (data.length > 0) {
        const ctx = document.getElementById('plChart')?.getContext('2d');
        if (ctx) {
          if (myCharts['plChart']) myCharts['plChart'].destroy();
          myCharts['plChart'] = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: data.map(d => d.mela.MelaName.length>15 ? d.mela.MelaName.slice(0,15)+'…' : d.mela.MelaName),
              datasets: [
                { label:'Revenue',  data: data.map(d=>d.revenue),  backgroundColor:'#3D6338' },
                { label:'Expenses', data: data.map(d=>d.expenses), backgroundColor:'#B83225' },
              ]
            },
            options: {
              indexAxis: 'y',
              responsive: true, maintainAspectRatio: false,
              plugins: { legend:{ position:'top', labels:{font:{family:'Nunito',size:12}} } },
              scales: {
                x: { beginAtZero:true, ticks:{callback:v=>'₹'+HS.fmt(v),font:{family:'Nunito',size:11}} },
                y: { ticks:{font:{family:'Nunito',size:11}} },
              }
            }
          });
        }
      }
    }
  </script>
</body>
</html>
