<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Havyaka Swaada — Page Title</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <!-- INNER HEADER: compact, dark, sticky -->
  <header class="hs-header" id="hs-header">
    <!-- Rendered by HS.renderHeader() in the script below -->
  </header>

  <!-- PAGE CONTENT -->
  <main class="hs-page" id="mainContent">

    <!-- Example card — replace with page-specific content -->
    <div class="hs-card">
      <div class="hs-card-title">📋 Section Title</div>
      <p class="hs-text-muted">Page content goes here.</p>
    </div>

  </main>

  <!-- Sidebar (injected by HS.renderSidebar) -->
  <!-- Toast & Loading (injected by common.js) -->

  <script src="assets/common.js"></script>
  <script>
    /* ── Change 'log' to the active nav id for this page ── */
    HS.renderSidebar('log');

    /* ── Update title / subtitle to match this page ── */
    const mela = HS.getCurrentMela();
    HS.renderHeader({
      title:    'Page Title',
      subtitle: mela ? mela.name : '',
      showMenu: true,
    });
  </script>

</body>
</html>
