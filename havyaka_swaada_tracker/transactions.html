<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Transactions — Havyaka Swaada</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .filter-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .filter-chip {
      padding: 5px 13px; border-radius: 20px; border: 2px solid var(--border);
      background: var(--cream); color: var(--brown-mid);
      font-family: 'Nunito',sans-serif; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: all .18s;
    }
    .filter-chip.on { background: var(--brown); border-color: var(--brown); color: #fff; }

    .pending-banner {
      background: rgba(184,50,37,.08); border: 1px solid rgba(184,50,37,.25);
      border-radius: var(--radius); padding: 13px 15px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .pending-banner .p-icon  { font-size: 22px; flex-shrink: 0; }
    .pending-banner .p-title { font-family:'Playfair Display',serif; font-size:14px; color:var(--red); }
    .pending-banner .p-sub   { font-size:12px; color:var(--brown-mid); margin-top:2px; }

    .tx-card {
      background: var(--cream-light); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 13px 14px;
      margin-bottom: 10px; box-shadow: var(--shadow-sm);
    }
    .tx-card.organiser { border-left: 4px solid var(--red); }

    .tx-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .tx-date { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    .pay-badge {
      font-size: 11px; font-weight: 700; padding: 3px 9px;
      border-radius: 20px; white-space: nowrap;
    }
    .pay-badge.cash      { background: rgba(61,99,56,.15);  color: var(--green); }
    .pay-badge.online    { background: rgba(196,132,26,.15); color: var(--gold); }
    .pay-badge.free      { background: rgba(0,0,0,.07);      color: var(--text-muted); }
    .pay-badge.organiser { background: rgba(184,50,37,.12);  color: var(--red); }

    .tx-customer { font-size: 13px; font-weight: 600; color: var(--brown-dark); margin-bottom: 4px; }
    .tx-items    { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 6px; }

    .tx-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tx-amount { font-family:'Playfair Display',serif; font-size:16px; color:var(--brown); }
    .tx-amount.free { color: var(--text-muted); text-decoration: line-through; font-size:14px; }

    .tx-actions { display: flex; gap: 6px; align-items: center; }
    .tx-action-btn {
      width: 30px; height: 30px; border-radius: 7px; border: none;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tx-action-btn:active { filter: brightness(.85); }

    .mark-paid-btn {
      padding: 7px 14px; border-radius: 8px;
      background: var(--green); color: #fff; border: none;
      font-family:'Nunito',sans-serif; font-size: 12.5px; font-weight: 700;
      cursor: pointer; transition: filter .18s;
    }
    .mark-paid-btn:active { filter: brightness(.88); }

    /* Edit modal item rows */
    .edit-item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px dashed var(--border);
    }
    .edit-item-row:last-child { border-bottom: none; }
    .edit-item-info { flex: 1; min-width: 0; }
    .edit-item-name  { font-size: 14px; font-weight: 700; color: var(--brown); }
    .edit-item-price { font-size: 12px; color: var(--gold); font-weight: 600; margin-top: 2px; }
    .pay-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .pay-grid .hs-tog { flex: 1 1 calc(50% - 4px); min-width: 80px; }
  </style>
</head>
<body>

  <header class="hs-header" id="hs-header"></header>

  <main class="hs-page" id="mainPage">
    <div class="hs-empty">
      <div class="hs-spinner" style="margin:0 auto 12px;"></div>
      <div class="hs-empty-sub">Loading transactions…</div>
    </div>
  </main>

  <!-- ══ MARK AS PAID MODAL ══ -->
  <div class="hs-modal-bg" id="paidModal">
    <div class="hs-modal">
      <div class="hs-modal-handle"></div>
      <div class="hs-modal-title">Mark as Paid</div>
      <p class="hs-text-muted hs-mb">How did the organiser pay?</p>
      <input type="hidden" id="paidRowIndex" />
      <input type="hidden" id="paidTxId" />
      <div class="hs-toggle-pair">
        <button class="hs-tog" id="paidCash"   onclick="setPaidMode('cash')">💵 Cash</button>
        <button class="hs-tog" id="paidOnline" onclick="setPaidMode('online')">📱 Online</button>
      </div>
      <div class="hs-mt">
        <button class="hs-btn hs-btn-primary hs-btn-full" onclick="confirmMarkPaid()">✓ Confirm</button>
      </div>
      <div class="hs-mt-sm">
        <button class="hs-btn hs-btn-ghost hs-btn-full" onclick="HS.closeModal('paidModal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ══ EDIT TRANSACTION MODAL ══ -->
  <div class="hs-modal-bg" id="editModal">
    <div class="hs-modal">
      <div class="hs-modal-handle"></div>
      <div class="hs-modal-title">Edit Transaction</div>
      <input type="hidden" id="editTxId" />
      <input type="hidden" id="editRowIndex" />

      <div class="hs-card" style="margin-bottom:10px;">
        <div class="hs-card-title">📅 Date</div>
        <input class="hs-input" type="date" id="editDate" />
      </div>

      <div class="hs-card" style="margin-bottom:10px;">
        <div class="hs-card-title">👤 Customer</div>
        <div class="hs-field">
          <label class="hs-label">Name <span class="hs-opt">optional</span></label>
          <input class="hs-input" type="text" id="editCustName" placeholder="Customer name" autocomplete="off" />
        </div>
        <div class="hs-field">
          <label class="hs-label">Phone <span class="hs-opt">optional</span></label>
          <input class="hs-input" type="tel" id="editCustPhone" placeholder="Phone number" autocomplete="off" />
        </div>
        <div class="hs-card-title" style="margin-top:10px;">Customer Type</div>
        <div class="hs-toggle-pair">
          <button class="hs-tog on-green" id="editTogNormal"     onclick="editSetCustType('normal')">👤 Normal</button>
          <button class="hs-tog"          id="editTogInfluencer" onclick="editSetCustType('influencer')">⭐ Influencer</button>
        </div>
        <div id="editSmField" style="display:none;margin-top:8px;">
          <input class="hs-input" type="text" id="editSocialMedia"
                 placeholder="@username or profile link" autocomplete="off" />
        </div>
      </div>

      <div class="hs-card" style="margin-bottom:10px;">
        <div class="hs-card-title">🛒 Items Ordered</div>
        <div id="editItemRows"></div>
      </div>

      <div class="hs-card" style="margin-bottom:10px;">
        <div class="hs-card-title">💳 Payment Mode</div>
        <div class="pay-grid" id="editPaymentOptions"></div>
      </div>

      <div id="editTotalPreview"
           style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
                  color:var(--brown);text-align:right;margin-bottom:12px;"></div>

      <button class="hs-btn hs-btn-primary hs-btn-full" onclick="saveEdit()">💾 Save Changes</button>
      <div class="hs-mt-sm">
        <button class="hs-btn hs-btn-ghost hs-btn-full" onclick="HS.closeModal('editModal')">Cancel</button>
      </div>
    </div>
  </div>

  <script src="assets/common.js"></script>
  <script>
    const OLD_COL_TO_KEY = {
      'NeerGojjuShot':'item_neerShot','NeerGojjuFull':'item_neerFull',
      'HunaseHannina':'item_hunase','HalfHunaseHannina':'item_halfHunase',
      'MandanGojju100':'item_mandan100','MandanGojju200':'item_mandan200',
      'MandanGojju500':'item_mandan500','MangoGula100':'item_mangoGula100',
      'MangoGula250':'item_mangoGula250',
    };

    const PAY_OPTIONS = {
      normal:     ['online','cash','free'],
      influencer: ['online','cash','free','organiser'],
    };
    const PAY_LABELS = {
      online:'📱 Online', cash:'💵 Cash', free:'🎁 Free', organiser:'🏢 Organiser',
    };

    let mela      = null;
    let allTx     = [];
    let menuItems = [];   // active mela menu items (for edit modal)
    let itemMap   = {};
    let selFilter = 'all';
    let paidMode  = 'cash';

    // Edit modal state
    let editQty      = {};
    let editCustType = 'normal';
    let editPayMode  = 'online';

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', async () => {
      mela = HS.getCurrentMela();
      if (!mela) { HS.navigate('index.html'); return; }
      HS.renderSidebar('transactions');
      HS.renderHeader({ title: 'Transactions', subtitle: mela.MelaName, showMenu: true });
      await loadAll();
    });

    async function loadAll() {
      HS.loading(true, 'Loading…');
      try {
        const [menuRes, dataRes] = await Promise.all([
          HS.api({ action: 'getMelaMenu', melaId: mela.MelaId }),
          HS.api({ action: 'getData',     melaId: mela.MelaId }),
        ]);
        menuItems = (menuRes.data || []).filter(i => i.Status === 'active');
        itemMap   = {};
        (menuRes.data || []).forEach(it => { itemMap[it.ItemKey] = it; });
        Object.entries(OLD_COL_TO_KEY).forEach(([col,key]) => {
          if (!itemMap[key]) itemMap[key] = { ItemName: col, SellingPrice: 0 };
        });
        allTx = (dataRes.data || []).map(normalizeRow).reverse();
        render();
      } catch(e) {
        HS.toast('Could not load transactions.', 'error');
      } finally { HS.loading(false); }
    }

    /* ── NORMALIZE ── */
    function normalizeRow(row) {
      if (row.Items !== undefined && row.Items !== '') {
        try {
          const parsed = JSON.parse(row.Items);
          row._items = {};
          Object.entries(parsed).forEach(([k,v]) => {
            if (v && typeof v==='object') {
              const p = (v.price !== null && v.price !== undefined) ? Number(v.price) : null;
              row._items[k] = { qty: Number(v.qty||0), price: p };
            } else {
              row._items[k] = { qty: Number(v||0), price: null };
            }
          });
        } catch { row._items = {}; }
      } else {
        row._items = {};
        Object.entries(OLD_COL_TO_KEY).forEach(([col,key]) => {
          const q = Number(row[col]||0);
          if (q>0) row._items[key] = {qty:q, price:null};
        });
      }
      return row;
    }

    /* ── RENDER ── */
    function render() {
      const filtered   = selFilter === 'all' ? allTx : allTx.filter(t => t.PaymentMode === selFilter);
      const orgPending = allTx.filter(t => t.PaymentMode === 'organiser');
      const orgTotal   = orgPending.reduce((s,t) => s + Number(t.TotalAmount||0), 0);

      let html = '';

      if (orgPending.length > 0) {
        html += `<div class="pending-banner">
          <div class="p-icon">🏢</div>
          <div>
            <div class="p-title">₹${HS.fmt(orgTotal)} Pending from Organiser</div>
            <div class="p-sub">${orgPending.length} order${orgPending.length>1?'s':''} not yet settled</div>
          </div>
        </div>`;
      }

      const filters = [
        {id:'all',label:'All'},
        {id:'cash',label:'💵 Cash'},
        {id:'online',label:'📱 Online'},
        {id:'free',label:'🎁 Free'},
        {id:'organiser',label:'🏢 Organiser'},
      ];
      html += `<div class="filter-bar">`;
      filters.forEach(f => {
        const count = f.id==='all' ? allTx.length : allTx.filter(t=>t.PaymentMode===f.id).length;
        if (f.id!=='all' && count===0) return;
        html += `<div class="filter-chip ${selFilter===f.id?'on':''}" onclick="setFilter('${f.id}')">${f.label} (${count})</div>`;
      });
      html += `</div>`;

      if (!filtered.length) {
        html += `<div class="hs-empty"><div class="hs-empty-icon">🧾</div><div class="hs-empty-title">No transactions</div><div class="hs-empty-sub">No orders found for this filter.</div></div>`;
      } else {
        html += filtered.map(txCardHTML).join('');
      }

      document.getElementById('mainPage').innerHTML = html;
    }

    function setFilter(f) { selFilter = f; render(); }

    function txCardHTML(tx) {
      const pm     = (tx.PaymentMode || 'cash').toLowerCase();
      const date   = HS.formatDate(tx.Date) || tx.Date || '—';
      const name   = tx.CustomerName || 'Anonymous';
      const phone  = tx.Phone ? ` · ${tx.Phone}` : '';
      const isFree = pm === 'free';
      const txId   = tx.TransactionId || '';
      const ri     = tx._rowIndex || '';

      const parts = [];
      Object.entries(tx._items || {}).forEach(([key, val]) => {
        const q = val.qty || 0;
        if (q > 0) parts.push(`${itemMap[key]?.ItemName || key} ×${q}`);
      });
      const itemsSummary = parts.join(', ') || '—';

      const badgeLabels = {cash:'💵 Cash',online:'📱 Online',free:'🎁 Free',organiser:'🏢 Organiser (Pending)'};
      const infLabel    = tx.CustomerType==='influencer' ? ' · ⭐ Influencer' : '';

      return `
        <div class="tx-card ${pm==='organiser'?'organiser':''}">
          <div class="tx-top">
            <span class="tx-date">${date}${infLabel}</span>
            <span class="pay-badge ${pm}">${badgeLabels[pm]||pm}</span>
          </div>
          <div class="tx-customer">${name}${phone}</div>
          <div class="tx-items">${itemsSummary}</div>
          <div class="tx-footer">
            <span class="tx-amount ${isFree?'free':''}">₹${HS.fmt(tx.TotalAmount)}</span>
            <div class="tx-actions">
              ${pm==='organiser' ? `<button class="mark-paid-btn" onclick="openMarkPaid('${txId}',${ri})">✓ Mark as Paid</button>` : ''}
              <button class="tx-action-btn" style="background:rgba(61,99,56,.12);"
                onclick="openEditModal('${txId}',${ri})" title="Edit">✏️</button>
              <button class="tx-action-btn" style="background:rgba(184,50,37,.10);"
                onclick="deleteTx('${txId}',${ri})" title="Delete">🗑️</button>
            </div>
          </div>
        </div>`;
    }

    /* ══ MARK AS PAID ══ */
    function openMarkPaid(txId, rowIndex) {
      document.getElementById('paidTxId').value    = txId;
      document.getElementById('paidRowIndex').value = rowIndex;
      paidMode = 'cash';
      document.getElementById('paidCash').className   = 'hs-tog on-green';
      document.getElementById('paidOnline').className = 'hs-tog';
      HS.openModal('paidModal');
    }

    function setPaidMode(m) {
      paidMode = m;
      document.getElementById('paidCash').className   = 'hs-tog' + (m==='cash'  ?' on-green':'');
      document.getElementById('paidOnline').className = 'hs-tog' + (m==='online'?' on-green':'');
    }

    async function confirmMarkPaid() {
      const txId     = document.getElementById('paidTxId').value;
      const rowIndex = Number(document.getElementById('paidRowIndex').value);
      HS.closeModal('paidModal');
      HS.loading(true, 'Updating payment…');
      try {
        const res = await HS.api({
          action: 'updatePaymentMode',
          melaId: mela.MelaId,
          rowIndex,
          paymentMode: paidMode,
        });
        if (res.success) {
          const tx = allTx.find(t => (t.TransactionId===txId) || (t._rowIndex===rowIndex));
          if (tx) tx.PaymentMode = paidMode;
          HS.toast(`✅ Marked as ${paidMode}!`, 'success');
          render();
        } else { HS.toast('Error: ' + (res.error||'Unknown'), 'error'); }
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }

    /* ══ EDIT MODAL ══ */
    function openEditModal(txId, rowIndex) {
      const tx = allTx.find(t => (txId && t.TransactionId===txId) || t._rowIndex===rowIndex);
      if (!tx) { HS.toast('Transaction not found.', 'error'); return; }

      document.getElementById('editTxId').value    = txId || '';
      document.getElementById('editRowIndex').value = rowIndex || '';
      document.getElementById('editDate').value    = tx.Date || HS.today();
      document.getElementById('editCustName').value  = tx.CustomerName || '';
      document.getElementById('editCustPhone').value = tx.Phone || '';
      document.getElementById('editSocialMedia').value = tx.SocialMedia || '';

      editCustType = tx.CustomerType || 'normal';
      editPayMode  = tx.PaymentMode  || 'online';

      // Set customer type UI
      editSetCustType(editCustType, true);

      // Build qty map from existing items
      editQty = {};
      menuItems.forEach(it => { editQty[it.ItemKey] = 0; });
      Object.entries(tx._items || {}).forEach(([key, val]) => {
        editQty[key] = val.qty || 0;
      });

      renderEditItems();
      renderEditPayment();
      updateEditTotal();
      HS.openModal('editModal');
    }

    function editSetCustType(t, skipRender) {
      editCustType = t;
      document.getElementById('editTogNormal').className     = 'hs-tog' + (t==='normal'     ?' on-green':'');
      document.getElementById('editTogInfluencer').className = 'hs-tog' + (t==='influencer' ?' on-gold':'');
      document.getElementById('editSmField').style.display   = t==='influencer' ? 'block' : 'none';
      if (!skipRender) { renderEditPayment(); updateEditTotal(); }
    }

    function renderEditItems() {
      document.getElementById('editItemRows').innerHTML = menuItems.map(it => `
        <div class="edit-item-row">
          <div class="edit-item-info">
            <div class="edit-item-name">${it.ItemName}</div>
            <div class="edit-item-price">₹${HS.fmt(it.SellingPrice)} each</div>
          </div>
          <div class="hs-qty-ctrl">
            <button class="hs-qty-btn" onclick="editChQty('${it.ItemKey}',-1)">−</button>
            <span class="hs-qty-num ${(editQty[it.ItemKey]||0)>0?'active':''}"
                  id="eq-${it.ItemKey}">${editQty[it.ItemKey]||0}</span>
            <button class="hs-qty-btn" onclick="editChQty('${it.ItemKey}',1)">+</button>
          </div>
        </div>`).join('');
    }

    function renderEditPayment() {
      const modes = PAY_OPTIONS[editCustType] || PAY_OPTIONS.normal;
      document.getElementById('editPaymentOptions').innerHTML = modes.map(m =>
        `<button class="hs-tog ${editPayMode===m?'on-green':''}"
          onclick="editSetPay('${m}')">${PAY_LABELS[m]}</button>`
      ).join('');
    }

    function editChQty(key, d) {
      editQty[key] = Math.max(0, (editQty[key]||0) + d);
      const el = document.getElementById('eq-' + key);
      if (el) { el.textContent = editQty[key]; el.className = 'hs-qty-num' + (editQty[key]>0?' active':''); }
      updateEditTotal();
    }

    function editSetPay(m) {
      editPayMode = m;
      renderEditPayment();
      updateEditTotal();
    }

    function editCalcTotal() {
      return menuItems.reduce((s,it) => s + it.SellingPrice * (editQty[it.ItemKey]||0), 0);
    }

    function updateEditTotal() {
      const total = editCalcTotal();
      const el    = document.getElementById('editTotalPreview');
      if (el) el.textContent = total > 0 ? `Total: ₹${HS.fmt(total)}` : '';
    }

    async function saveEdit() {
      const txId     = document.getElementById('editTxId').value;
      const rowIndex = document.getElementById('editRowIndex').value;
      const date     = document.getElementById('editDate').value;
      const custName = document.getElementById('editCustName').value.trim();
      const phone    = document.getElementById('editCustPhone').value.trim();
      const social   = document.getElementById('editSocialMedia').value.trim();

      const hasItems = menuItems.some(it => (editQty[it.ItemKey]||0) > 0);
      if (!hasItems) { HS.toast('Select at least one item.', 'error'); return; }
      if (!date)     { HS.toast('Date is required.', 'error'); return; }

      const items = {};
      menuItems.forEach(it => {
        if ((editQty[it.ItemKey]||0) > 0)
          items[it.ItemKey] = { qty: editQty[it.ItemKey], price: it.SellingPrice };
      });
      const total = editCalcTotal();

      HS.closeModal('editModal');
      HS.loading(true, 'Saving…');
      try {
        const res = await HS.api({
          action: 'updateTransaction',
          melaId: mela.MelaId,
          data: JSON.stringify({
            transactionId: txId || null,
            rowIndex:      rowIndex ? Number(rowIndex) : null,
            timestamp:     new Date().toISOString(),
            date,
            customerName:  custName,
            phone,
            customerType:  editCustType,
            socialMedia:   social,
            items,
            totalAmount:   total,
            paymentMode:   editPayMode,
          }),
        });
        if (res.success) {
          HS.toast('✅ Transaction updated!', 'success');
          await loadAll();
        } else { HS.toast('Error: ' + (res.error||'Unknown'), 'error'); }
      } catch(e) { HS.toast('Network error.', 'error'); }
      finally { HS.loading(false); }
    }

    /* ══ DELETE ══ */
    async function deleteTx(txId, rowIndex) {
      HS.confirm('Delete this transaction? This cannot be undone.', async () => {
        HS.loading(true, 'Deleting…');
        try {
          const res = await HS.api({
            action: 'deleteTransaction',
            melaId: mela.MelaId,
            transactionId: txId || null,
            rowIndex: rowIndex || null,
          });
          if (res.success) {
            HS.toast('Transaction deleted.', 'success');
            await loadAll();
          } else { HS.toast('Error: ' + (res.error||'Unknown'), 'error'); }
        } catch(e) { HS.toast('Network error.', 'error'); }
        finally { HS.loading(false); }
      });
    }
  </script>
</body>
</html>
