<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Log Sale — Havyaka Swaada</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0; border-bottom: 1px dashed var(--border);
    }
    .item-row:first-child { padding-top: 0; }
    .item-row:last-child  { border-bottom: none; padding-bottom: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name  { font-size: 14px; font-weight: 700; color: var(--brown); }
    .item-price { font-size: 12px; color: var(--gold); font-weight: 600; margin-top: 2px; }
    .inf-row {
      margin-top: 10px; padding: 9px 12px;
      background: rgba(196,132,26,.12); border: 1px solid rgba(196,132,26,.3);
      border-radius: 8px; font-size: 12.5px; color: var(--gold); font-weight: 600;
    }
    .save-wrap { position: sticky; bottom: 16px; }
  </style>
</head>
<body>

  <header class="hs-header" id="hs-header"></header>

  <main class="hs-page" id="mainPage">
    <div class="hs-empty">
      <div class="hs-spinner" style="margin:0 auto 12px;"></div>
      <div class="hs-empty-sub">Loading menu…</div>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script>
    /* ── STATE ── */
    let menuItems = [];   // Active items for this mela
    let qty       = {};
    let custType  = 'normal';
    let payMode   = 'online';
    let mela      = null;

    /* ── INIT ── */
    document.addEventListener('DOMContentLoaded', async () => {
      mela = HS.getCurrentMela();
      if (!mela) { HS.navigate('index.html'); return; }

      HS.renderSidebar('log');
      HS.renderHeader({ title: 'Log Sale', subtitle: mela.MelaName, showMenu: true });

      const CACHE_KEY = 'hs_menu_' + mela.MelaId;
      const cached    = HS.lsGet(CACHE_KEY);

      if (cached && cached.length > 0) {
        // Show cached menu instantly — no loading spinner
        menuItems = cached.filter(i => i.Status === 'active');
        if (menuItems.length > 0) {
          menuItems.forEach(it => { qty[it.ItemKey] = 0; });
          renderPage();
          // Silently refresh in background
          refreshMenuBg(CACHE_KEY);
          return;
        }
      }

      // No usable cache — fetch with spinner
      HS.loading(true, 'Loading menu…');
      try {
        const res  = await HS.api({ action: 'getMelaMenu', melaId: mela.MelaId });
        const all  = res.data || [];
        HS.lsSet(CACHE_KEY, all);
        menuItems  = all.filter(i => i.Status === 'active');
        if (!menuItems.length) { HS.navigate('menu.html?setup=1'); return; }
        menuItems.forEach(it => { qty[it.ItemKey] = 0; });
        renderPage();
      } catch(e) {
        HS.toast('Could not load menu.', 'error');
      } finally {
        HS.loading(false);
      }
    });

    /* Silent background refresh — updates items if changed */
    async function refreshMenuBg(cacheKey) {
      try {
        const res  = await HS.api({ action: 'getMelaMenu', melaId: mela.MelaId });
        const all  = res.data || [];
        HS.lsSet(cacheKey, all);
        const fresh = all.filter(i => i.Status === 'active');
        // Re-render only if items actually changed
        const oldKeys   = menuItems.map(i => i.ItemKey).join(',');
        const freshKeys = fresh.map(i => i.ItemKey).join(',');
        if (oldKeys !== freshKeys) {
          menuItems = fresh;
          fresh.forEach(it => { if (qty[it.ItemKey] === undefined) qty[it.ItemKey] = 0; });
          renderPage();
        }
      } catch(e) { /* silent — user already sees cached content */ }
    }

    /* ── RENDER PAGE ── */
    function renderPage() {
      document.getElementById('mainPage').innerHTML = `
        <!-- Date -->
        <div class="hs-card">
          <div class="hs-card-title">📅 Date</div>
          <div class="hs-row">
            <label class="hs-label" style="margin:0;white-space:nowrap;">Purchase Date</label>
            <input class="hs-input" type="date" id="purchaseDate" style="flex:1;" value="${HS.today()}" />
          </div>
        </div>

        <!-- Customer Info -->
        <div class="hs-card">
          <div class="hs-card-title">👤 Customer Info</div>
          <div class="hs-field">
            <label class="hs-label">Name <span class="hs-opt">optional</span></label>
            <input class="hs-input" type="text" id="custName" placeholder="Customer name" autocomplete="off" />
          </div>
          <div class="hs-field">
            <label class="hs-label">Phone <span class="hs-opt">optional</span></label>
            <input class="hs-input" type="tel" id="custPhone" placeholder="Phone number" autocomplete="off" />
          </div>
        </div>

        <!-- Customer Type -->
        <div class="hs-card">
          <div class="hs-card-title">🏷️ Customer Type</div>
          <div class="hs-toggle-pair">
            <button class="hs-tog on-green" id="togNormal"     onclick="setCustType('normal')">👤 Normal</button>
            <button class="hs-tog"          id="togInfluencer" onclick="setCustType('influencer')">⭐ Influencer</button>
          </div>
          <div id="smField" style="display:none;">
            <div class="hs-field hs-mt-sm">
              <label class="hs-label">Social Media Profile <span class="hs-opt">optional</span></label>
              <input class="hs-input" type="text" id="socialMedia" placeholder="@username or profile link" autocomplete="off" />
            </div>
            <div class="inf-row">⚠️ Influencer — amount calculated but not charged directly.</div>
          </div>
        </div>

        <!-- Items -->
        <div class="hs-card">
          <div class="hs-card-title">🛒 Items Ordered</div>
          ${menuItems.map(it => `
            <div class="item-row">
              <div class="item-info">
                <div class="item-name">${it.ItemName}</div>
                <div class="item-price">₹${HS.fmt(it.SellingPrice)} each</div>
              </div>
              <div class="hs-qty-ctrl">
                <button class="hs-qty-btn" onclick="chQty('${it.ItemKey}',-1)">−</button>
                <span class="hs-qty-num" id="q-${it.ItemKey}">0</span>
                <button class="hs-qty-btn" onclick="chQty('${it.ItemKey}',1)">+</button>
              </div>
            </div>`).join('')}
        </div>

        <!-- Payment -->
        <div class="hs-card">
          <div class="hs-card-title">💳 Payment Mode</div>
          <div class="hs-toggle-pair">
            <button class="hs-tog on-green" id="payOnline" onclick="setPay('online')">📱 Online</button>
            <button class="hs-tog"          id="payCash"   onclick="setPay('cash')">💵 Cash</button>
          </div>
        </div>

        <!-- Save -->
        <div class="save-wrap">
          <button class="hs-btn-cta inactive" id="saveBtn" onclick="savePurchase()">
            Nothing selected yet
          </button>
        </div>
      `;
    }

    /* ── QTY ── */
    function chQty(key, d) {
      qty[key] = Math.max(0, (qty[key]||0) + d);
      const el = document.getElementById('q-' + key);
      if (el) { el.textContent = qty[key]; el.className = 'hs-qty-num' + (qty[key]>0?' active':''); }
      updateSaveBtn();
    }

    function calcTotal() {
      return menuItems.reduce((s, it) => s + it.SellingPrice * (qty[it.ItemKey]||0), 0);
    }

    function updateSaveBtn() {
      const total = calcTotal();
      const btn   = document.getElementById('saveBtn');
      if (!btn) return;
      if (total === 0) {
        btn.textContent = 'Nothing selected yet'; btn.className = 'hs-btn-cta inactive'; btn.style.background='';
      } else if (custType === 'influencer') {
        btn.textContent = `⭐ Influencer — ₹${HS.fmt(total)}. Log Purchase.`;
        btn.className='hs-btn-cta'; btn.style.background='var(--gold)';
      } else {
        btn.textContent = `Amount ₹${HS.fmt(total)}. Purchased ✓`;
        btn.className='hs-btn-cta'; btn.style.background='';
      }
    }

    /* ── CUSTOMER TYPE & PAYMENT ── */
    function setCustType(t) {
      custType = t;
      document.getElementById('togNormal').className     = 'hs-tog'+(t==='normal'     ?' on-green':'');
      document.getElementById('togInfluencer').className = 'hs-tog'+(t==='influencer' ?' on-gold' :'');
      document.getElementById('smField').style.display   = t==='influencer'?'block':'none';
      updateSaveBtn();
    }

    function setPay(m) {
      payMode = m;
      document.getElementById('payOnline').className = 'hs-tog'+(m==='online'?' on-green':'');
      document.getElementById('payCash').className   = 'hs-tog'+(m==='cash'  ?' on-green':'');
    }

    /* ── SAVE ── */
    async function savePurchase() {
      const total = calcTotal();
      if (total === 0) { HS.toast('Please select at least one item.', 'error'); return; }

      // Build items object: { itemKey: {qty, price} } — only non-zero
      const items = {};
      menuItems.forEach(it => {
        if (qty[it.ItemKey] > 0)
          items[it.ItemKey] = { qty: qty[it.ItemKey], price: it.SellingPrice };
      });

      const data = {
        timestamp:    new Date().toISOString(),
        date:         document.getElementById('purchaseDate').value,
        customerName: document.getElementById('custName')?.value.trim()   || '',
        phone:        document.getElementById('custPhone')?.value.trim()  || '',
        customerType: custType,
        socialMedia:  document.getElementById('socialMedia')?.value.trim()|| '',
        items,
        totalAmount:  total,
        paymentMode:  payMode,
      };

      HS.loading(true, 'Saving…');
      try {
        const res = await HS.api({ action:'save', melaId: mela.MelaId, data: JSON.stringify(data) });
        if (res.success) { HS.toast('✅ Purchase saved!', 'success'); resetForm(); }
        else HS.toast('Error: '+(res.error||'Unknown'), 'error');
      } catch(e) { HS.toast('Network error. Try again.', 'error'); }
      finally { HS.loading(false); }
    }

    function resetForm() {
      menuItems.forEach(it => {
        qty[it.ItemKey] = 0;
        const el = document.getElementById('q-'+it.ItemKey);
        if (el) { el.textContent='0'; el.className='hs-qty-num'; }
      });
      const custName = document.getElementById('custName');
      const custPhone = document.getElementById('custPhone');
      const socialMedia = document.getElementById('socialMedia');
      if (custName) custName.value = '';
      if (custPhone) custPhone.value = '';
      if (socialMedia) socialMedia.value = '';
      setCustType('normal');
      setPay('online');
      updateSaveBtn();
    }
  </script>
</body>
</html>
