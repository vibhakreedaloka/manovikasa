<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Archived Melas — Havyaka Swaada</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .arch-card {
      background: var(--cream-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      display: flex; align-items: center; gap: 12px;
      opacity: .85;
    }
    .arch-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--cream-dark); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .arch-info { flex: 1; min-width: 0; }
    .arch-name {
      font-family: 'Playfair Display', serif;
      font-size: 15px; color: var(--brown-mid);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .arch-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .restore-btn {
      padding: 8px 14px; border-radius: 8px;
      background: var(--green); color: #fff;
      border: none; font-size: 13px; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
      transition: filter var(--transition);
    }
    .restore-btn:active { filter: brightness(.88); }
  </style>
</head>
<body>

  <header class="hs-header" id="hs-header"></header>

  <main class="hs-page" id="archiveList">
    <div class="hs-empty">
      <div class="hs-spinner" style="margin:0 auto 12px;"></div>
      <div class="hs-empty-sub">Loading…</div>
    </div>
  </main>

  <script src="assets/common.js"></script>
  <script>
    let melas = [];

    document.addEventListener('DOMContentLoaded', () => {
      HS.renderHeader({ title: 'Archived Melas', showBack: true });
      loadMelas();
    });

    async function loadMelas() {
      HS.loading(true, 'Loading archive…');
      try {
        const res = await HS.api({ action: 'getMelas' });
        melas = (res.data || []).map(m => ({
          ...m,
          DateFrom: HS.normDate(m.DateFrom),
          DateTo:   HS.normDate(m.DateTo),
        }));
        render();
      } catch(e) {
        HS.toast('Could not load melas.', 'error', true);
      } finally {
        HS.loading(false);
      }
    }

    function render() {
      const archived = melas.filter(m => m.Status === 'archived');
      const el = document.getElementById('archiveList');

      if (!archived.length) {
        el.innerHTML = `
          <div class="hs-empty">
            <div class="hs-empty-icon">📦</div>
            <div class="hs-empty-title">No archived melas</div>
            <div class="hs-empty-sub">Archived melas will appear here.</div>
          </div>`;
        return;
      }

      el.innerHTML = `
        <div class="hs-section-lbl">Archived (${archived.length})</div>
        ${archived.map(archCardHTML).join('')}`;
    }

    function archCardHTML(m) {
      const dates = (m.DateFrom && m.DateTo)
        ? `${HS.shortDate(m.DateFrom)} – ${HS.shortDate(m.DateTo)}`
        : m.DateFrom ? HS.shortDate(m.DateFrom) : '';
      const sub = [m.Area, dates].filter(Boolean).join(' · ');

      return `
        <div class="arch-card">
          <div class="arch-icon">📦</div>
          <div class="arch-info">
            <div class="arch-name">${m.MelaName}</div>
            ${sub ? `<div class="arch-sub">${sub}</div>` : ''}
          </div>
          <button class="restore-btn" onclick="doRestore('${m.MelaId}')">↩ Restore</button>
        </div>`;
    }

    async function doRestore(melaId) {
      const m = melas.find(x => x.MelaId === melaId);
      if (!m) return;
      HS.loading(true, 'Restoring…');
      try {
        const res = await HS.api({ action: 'archiveMela', melaId, status: 'active' });
        if (res.success) {
          HS.toast(`"${m.MelaName}" restored!`, 'success', true);
          await loadMelas();
        } else {
          HS.toast('Error: ' + (res.error || 'Unknown'), 'error', true);
        }
      } catch(e) {
        HS.toast('Network error.', 'error', true);
      } finally {
        HS.loading(false);
      }
    }
  </script>
</body>
</html>
